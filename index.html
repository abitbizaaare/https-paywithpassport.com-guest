<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassportParking</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Open Sans", Arial, sans-serif;
            background: #f5f5f5;
            color: #1f2042;
        }

        header {
            background: #1f2042;
            color: #fff;
            padding: 25px;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .summary-box {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .summary-box div {
            margin: 10px 0;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: #1f2042;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #2a2b55;
        }
    </style>
</head>

<body>

<header>
    Passport Parking
</header>

<div class="container">

    <h2>Start Parking Session</h2>
    <p>Enter the Zone Number on signs or meter decals to start a parking session.</p>

    <!-- Zone Number -->
    <label>Zone Number</label>
    <input type="text" placeholder="">

    <!-- Location -->
    <label>Location</label>
    <input type="text" placeholder="">

    <!-- Vehicle Plate -->
    <label>Vehicle Plate Number</label>
    <input type="text" placeholder="">

    <!-- State / Province -->
    <label>State or Province</label>
    <select>
        <option value="">Select State</option>
    </select>

    <!-- Duration -->
    <label>Duration</label>
    <select>
        <option value="">Select Duration</option>
    </select>

    <!-- Payment Summary -->
    <div class="summary-box">
        <h3>Payment Summary</h3>
        <div>Parking Fee: <strong>$0.00</strong></div>
        <div>Convenience Fee: <strong>$0.00</strong></div>
        <div>Total: <strong>$0.00</strong></div>
        <small>All applicable taxes and fees included</small>
    </div>

    <!-- Receipt Email -->
    <label>Receipt Email *</label>
    <input type="email" placeholder="">

    <button>Pay with Card</button>

</div>

</body>
</html>
